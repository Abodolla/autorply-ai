<!doctype html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<base href="/autorply-ai/" />
	<title>مساعد Autorply</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" />
	<style>
		:root{--primary:#2563eb;--primary-dark:#1d4ed8;--bg:#f7f8fa;--surface:#fff;--sidebar:#f9fafb;--border:#e5e7eb;--text:#111827;--muted:#6b7280;--soft:#f3f4f6;--success:#16a34a;--danger:#dc2626}
		*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button,textarea{font:inherit}
		.app-shell{display:grid;grid-template-columns:280px minmax(0,1fr);width:min(1440px,100%);height:100dvh;margin:auto;background:var(--surface);overflow:hidden}
		.sidebar{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--sidebar);border-left:1px solid var(--border)}
		.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 12px}.logo{width:36px;height:36px;object-fit:contain;border-radius:10px}.brand h1{font-size:.98rem;margin:0}.brand p{color:var(--muted);font-size:.75rem;margin:2px 0 0}
		.new-chat{display:flex;align-items:center;justify-content:center;gap:8px;height:42px;margin:6px 12px 16px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:#1f2937;font-weight:650;cursor:pointer;transition:.15s}.new-chat:hover{background:#f3f4f6;border-color:#9ca3af}.new-chat:disabled{opacity:.5;cursor:not-allowed}.new-chat svg{width:18px;height:18px}
		.sidebar-title{display:flex;justify-content:space-between;padding:0 16px 9px;color:var(--muted);font-size:.75rem;font-weight:600}.conversation-list{flex:1;min-height:0;overflow-y:auto;padding:0 8px 16px}.conversation-item{display:flex;align-items:center;gap:5px;margin-bottom:3px;border-radius:9px;transition:background .15s}.conversation-item:hover,.conversation-item.active{background:#e9edf3}.conversation-open{display:flex;flex:1;min-width:0;align-items:center;gap:9px;padding:10px 8px;border:0;background:transparent;color:var(--text);text-align:right;cursor:pointer}.conversation-icon{flex:0 0 auto;width:17px;height:17px;color:#6b7280}.conversation-copy{min-width:0;flex:1}.conversation-name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.86rem}.conversation-date{display:block;margin-top:2px;color:#9ca3af;font-size:.68rem}.delete-chat{display:grid;place-items:center;width:30px;height:30px;margin-left:4px;border:0;border-radius:8px;background:transparent;color:#9ca3af;cursor:pointer;opacity:0}.conversation-item:hover .delete-chat,.conversation-item.active .delete-chat{opacity:1}.delete-chat:hover{background:#fee2e2;color:var(--danger)}.delete-chat svg{width:16px;height:16px}.empty-list{padding:22px 12px;color:var(--muted);text-align:center;font-size:.84rem}.notice{display:none;margin:0 12px 12px;padding:10px 12px;border-radius:9px;background:#fef3c7;color:#92400e;font-size:.8rem}.notice.visible{display:block}
		.chat-area{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0;overflow:hidden;background:#fff}.chat-header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;height:62px;padding:0 24px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.94);backdrop-filter:blur(10px)}.chat-header h2{max-width:65%;margin:0;font-size:.94rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:.76rem}.status-dot{width:8px;height:8px;border-radius:50%;background:#f59e0b}.status.connected .status-dot{background:var(--success)}.status.disconnected .status-dot{background:var(--danger)}
		.chat-messages{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:30px 24px 24px;scroll-behavior:smooth}.message{display:grid;grid-template-columns:32px minmax(0,720px);gap:12px;justify-content:center;width:100%;margin:0 auto 26px;line-height:1.8}.message-avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#111827;color:#fff;font-size:.72rem;font-weight:800}.user-message .message-avatar{background:#dbeafe;color:#1d4ed8}.message-body{min-width:0;padding-top:2px}.message-label{display:block;margin-bottom:4px;font-size:.78rem;font-weight:700;color:#374151}.message p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:#1f2937}.user-message p{color:#111827}
		.welcome{max-width:720px;margin:10vh auto 0;text-align:center}.welcome-mark{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 18px;border-radius:16px;background:#111827;color:#fff;font-size:1.05rem;font-weight:800}.welcome h3{margin:0 0 8px;font-size:1.45rem}.welcome p{margin:0;color:var(--muted);line-height:1.8}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:28px;text-align:right}.suggestion{display:flex;align-items:center;gap:12px;min-height:78px;padding:14px;border:1px solid var(--border);border-radius:14px;background:#fff;color:var(--text);cursor:pointer;transition:.16s}.suggestion:hover{border-color:#bfdbfe;background:#f8fbff;transform:translateY(-1px);box-shadow:0 8px 22px rgba(37,99,235,.07)}.suggestion-icon{display:grid;place-items:center;flex:0 0 auto;width:38px;height:38px;border-radius:11px;background:#eff6ff;color:var(--primary)}.suggestion-icon svg{width:20px;height:20px}.suggestion strong{display:block;font-size:.88rem}.suggestion small{display:block;margin-top:3px;color:var(--muted);font-size:.72rem}.suggestion-arrow{margin-right:auto;color:#9ca3af}.suggestion-arrow svg{width:17px;height:17px}
		.composer-wrap{position:relative;z-index:3;padding:10px 24px 18px;background:linear-gradient(to top,#fff 75%,rgba(255,255,255,0))}.typing-indicator{display:none;max-width:780px;margin:0 auto 7px;color:var(--muted);font-size:.75rem}.typing-indicator.visible{display:block}.composer{max-width:800px;margin:auto;border:1px solid #d1d5db;border-radius:16px;background:#fff;box-shadow:0 8px 28px rgba(15,23,42,.08);transition:.16s}.composer:focus-within{border-color:#93c5fd;box-shadow:0 8px 28px rgba(37,99,235,.1),0 0 0 3px rgba(37,99,235,.07)}#user-input{display:block;width:100%;min-height:50px;max-height:150px;padding:14px 15px 7px;border:0;background:transparent;outline:0;resize:none;direction:rtl;color:var(--text)}.composer-footer{display:flex;align-items:center;justify-content:space-between;padding:5px 7px 7px 12px}.save-state{display:inline-flex;align-items:center;gap:6px;color:#9ca3af;font-size:.7rem}.save-state::before{content:"";width:6px;height:6px;border-radius:50%;background:#9ca3af}.save-state.saving::before{background:#f59e0b}.save-state.saved::before{background:var(--success)}.save-state.error{color:var(--danger)}.save-state.error::before{background:var(--danger)}#send-button{display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:11px;background:#111827;color:#fff;cursor:pointer;transition:.15s}#send-button:hover{background:#000}#send-button:disabled{opacity:.35;cursor:not-allowed}#send-button svg{width:19px;height:19px}.composer-note{margin:8px 0 0;text-align:center;color:#9ca3af;font-size:.68rem}
		.toast-stack{position:fixed;top:18px;left:18px;z-index:80;display:flex;flex-direction:column;gap:9px}.app-toast{display:flex;align-items:center;gap:9px;min-width:280px;max-width:390px;padding:12px 14px;background:#fff;border:1px solid var(--border);border-radius:11px;box-shadow:0 12px 35px rgba(15,23,42,.16)}.app-toast.success{border-right:4px solid var(--success)}.app-toast.error{border-right:4px solid var(--danger)}.app-toast.info{border-right:4px solid var(--primary)}
		.modal-backdrop{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(15,23,42,.48);backdrop-filter:blur(2px)}.modal-backdrop.visible{display:flex}.confirm-card{width:min(420px,100%);background:#fff;border-radius:16px;box-shadow:0 25px 70px rgba(15,23,42,.25);overflow:hidden}.confirm-body{padding:24px}.confirm-icon{display:grid;place-items:center;width:44px;height:44px;margin-bottom:14px;border-radius:50%;background:#fee2e2;color:var(--danger);font-size:20px}.confirm-body h3{margin:0 0 7px;font-size:1.05rem}.confirm-body p{margin:0;color:var(--muted);line-height:1.7}.confirm-actions{display:flex;gap:9px;padding:14px 24px;background:#f9fafb;border-top:1px solid var(--border)}.btn{height:40px;padding:0 17px;border:0;border-radius:9px;font-weight:700;cursor:pointer}.btn-danger{background:var(--danger);color:#fff}.btn-secondary{background:#fff;color:#374151;border:1px solid #d1d5db}
		@media(max-width:760px){.app-shell{grid-template-columns:1fr;grid-template-rows:190px minmax(0,1fr)}.sidebar{border-left:0;border-bottom:1px solid var(--border)}.brand{padding:9px 12px 5px}.brand p,.sidebar-title{display:none}.new-chat{margin:5px 10px 8px;height:38px}.conversation-list{display:flex;overflow-x:auto;overflow-y:hidden;padding:0 8px 8px}.conversation-item{min-width:200px}.conversation-date{display:none}.chat-header{height:54px;padding:0 14px}.chat-messages{padding:22px 14px}.message{grid-template-columns:28px minmax(0,1fr);gap:9px;margin-bottom:22px}.message-avatar{width:27px;height:27px}.welcome{margin-top:5vh}.welcome h3{font-size:1.2rem}.suggestions{grid-template-columns:1fr;gap:8px;margin-top:20px}.suggestion{min-height:68px}.composer-wrap{padding:8px 10px 12px}.toast-stack{left:10px;right:10px;top:10px}.app-toast{min-width:0;max-width:none}}
	</style>
</head>
<body>
	<main class="app-shell">
		<aside class="sidebar">
			<div class="brand"><img class="logo" src="logo.png" alt="Autorply" /><div><h1>مساعد Autorply</h1><p>مساعد أعمالك الذكي</p></div></div>
			<button id="new-chat-button" class="new-chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg><span>محادثة جديدة</span></button>
			<div id="limit-notice" class="notice"></div>
			<div class="sidebar-title"><span>المحادثات</span><span id="conversation-count">0 / 20</span></div>
			<div id="conversation-list" class="conversation-list"></div>
		</aside>
		<section class="chat-area">
			<header class="chat-header"><h2 id="conversation-title">محادثة جديدة</h2><span id="connection-status" class="status"><span class="status-dot"></span><span id="connection-status-text">جاري الاتصال</span></span></header>
			<div id="chat-messages" class="chat-messages"></div>
			<div class="composer-wrap">
				<div class="typing-indicator" id="typing-indicator">جاري تجهيز الرد...</div>
				<div class="composer">
					<textarea id="user-input" placeholder="اسأل مساعد Autorply..." rows="1" disabled></textarea>
					<div class="composer-footer"><span id="save-state" class="save-state saved">محفوظ تلقائيًا</span><button id="send-button" aria-label="إرسال" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 14-7-4 14-3-6-7-1Z" stroke-linejoin="round"/><path d="m12 13 7-8" stroke-linecap="round"/></svg></button></div>
				</div>
				<p class="composer-note">قد يخطئ المساعد؛ راجع المعلومات المهمة قبل تنفيذها.</p>
			</div>
		</section>
	</main>
	<div id="toast-stack" class="toast-stack" aria-live="polite"></div>
	<div id="delete-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title" hidden>
		<div class="confirm-card"><div class="confirm-body"><div class="confirm-icon">!</div><h3 id="delete-modal-title">حذف المحادثة؟</h3><p>سيتم حذف المحادثة ورسائلها نهائيًا، ولا يمكن التراجع عن هذا الإجراء.</p></div><div class="confirm-actions"><button id="confirm-delete-button" class="btn btn-danger">حذف</button><button id="cancel-delete-button" class="btn btn-secondary">إلغاء</button></div></div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
	<script src="chat.js"></script>
</body>
</html>

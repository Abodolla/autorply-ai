<!doctype html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<base href="/autorply-ai/" />
	<title>مساعد Autorply</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" />
	<style>
		:root{--primary:#176bff;--primary-hover:#0d5bea;--background:#f5f7fb;--surface:#fff;--border:#e5e9f0;--text:#172033;--muted:#778198;--assistant:#f0f3f8}
		*{box-sizing:border-box} body{margin:0;min-height:100vh;background:var(--background);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
		button,textarea{font:inherit}.app-shell{display:grid;grid-template-columns:290px minmax(0,1fr);width:min(1250px,calc(100% - 28px));height:calc(100vh - 28px);margin:14px auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(30,46,80,.08)}
		.sidebar{display:flex;flex-direction:column;min-width:0;background:#fbfcfe;border-left:1px solid var(--border)}.brand{display:flex;align-items:center;gap:11px;padding:18px;border-bottom:1px solid var(--border)}.logo{width:42px;height:42px;object-fit:contain;border-radius:11px}.brand h1{font-size:1.05rem;margin:0}.brand p{color:var(--muted);font-size:.78rem;margin:2px 0 0}
		.new-chat{margin:14px;height:45px;border:0;border-radius:12px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer;transition:.18s}.new-chat:hover{background:var(--primary-hover)}.new-chat:disabled{opacity:.55;cursor:not-allowed}.sidebar-title{display:flex;justify-content:space-between;padding:3px 16px 9px;color:var(--muted);font-size:.8rem}.conversation-list{flex:1;overflow-y:auto;padding:0 9px 12px}.conversation-item{display:flex;align-items:center;gap:7px;margin-bottom:5px;border-radius:11px;transition:background .15s}.conversation-item.active{background:#eaf1ff}.conversation-open{flex:1;min-width:0;padding:11px 10px;border:0;background:transparent;color:var(--text);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.delete-chat{width:34px;height:34px;margin-left:5px;border:0;border-radius:9px;background:transparent;color:#a35b65;cursor:pointer;font-size:18px}.delete-chat:hover{background:#ffecef}.empty-list{padding:20px 12px;color:var(--muted);text-align:center;font-size:.88rem}
		.chat-area{display:flex;flex-direction:column;min-width:0}.chat-header{display:flex;align-items:center;justify-content:space-between;height:72px;padding:0 22px;border-bottom:1px solid var(--border)}.chat-header h2{font-size:1rem;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}.status{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:.82rem}.status-dot{width:9px;height:9px;border-radius:999px;background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.12)}.status.connected .status-dot{background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.12)}.status.disconnected .status-dot{background:#dc2626;box-shadow:0 0 0 3px rgba(220,38,38,.12)}
		.chat-messages{flex:1;overflow-y:auto;padding:26px;background:radial-gradient(circle at top right,rgba(23,107,255,.05),transparent 32%),#fff}.message{width:fit-content;max-width:min(78%,680px);margin-bottom:14px;padding:12px 15px;border-radius:14px;line-height:1.75}.message p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.user-message{margin-right:auto;background:var(--primary);color:#fff;border-bottom-left-radius:4px}.assistant-message{margin-left:auto;background:var(--assistant);border-bottom-right-radius:4px}.welcome{max-width:500px;margin:12vh auto 0;text-align:center;color:var(--muted);line-height:1.9}.welcome strong{display:block;color:var(--text);font-size:1.15rem;margin-bottom:4px}.typing-indicator{display:none;padding:0 24px 10px;color:var(--muted);font-size:.85rem}.typing-indicator.visible{display:block}.notice{display:none;margin:10px 14px 0;padding:10px 12px;border-radius:10px;background:#fff3cd;color:#765d00;font-size:.85rem}.notice.visible{display:block}
		.message-input{display:flex;align-items:flex-end;gap:10px;padding:14px;border-top:1px solid var(--border)}#user-input{flex:1;min-height:48px;max-height:150px;padding:13px 15px;border:1px solid var(--border);border-radius:12px;outline:none;resize:none;direction:rtl}#user-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(23,107,255,.08)}#send-button{height:48px;padding:0 22px;border:0;border-radius:12px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer}#send-button:disabled{opacity:.55;cursor:not-allowed}
		.toast-stack{position:fixed;top:20px;left:20px;z-index:80;display:flex;flex-direction:column;gap:10px}.app-toast{display:flex;align-items:center;gap:10px;min-width:280px;max-width:390px;padding:13px 15px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 35px rgba(15,23,42,.16);animation:toast-in .2s ease}.app-toast.success{border-right:4px solid #16a34a}.app-toast.error{border-right:4px solid #dc2626}.app-toast.info{border-right:4px solid var(--primary)}@keyframes toast-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
		.modal-backdrop{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(15,23,42,.48);backdrop-filter:blur(2px)}.modal-backdrop.visible{display:flex}.confirm-card{width:min(430px,100%);background:#fff;border-radius:18px;box-shadow:0 25px 70px rgba(15,23,42,.25);overflow:hidden}.confirm-body{padding:24px}.confirm-icon{display:grid;place-items:center;width:48px;height:48px;margin-bottom:15px;border-radius:999px;background:#fff1f2;color:#dc2626;font-size:24px}.confirm-body h3{margin:0 0 8px;font-size:1.08rem}.confirm-body p{margin:0;color:var(--muted);line-height:1.7}.confirm-actions{display:flex;gap:10px;justify-content:flex-start;padding:15px 24px;background:#f8fafc;border-top:1px solid var(--border)}.btn{height:42px;padding:0 18px;border:0;border-radius:10px;font-weight:700;cursor:pointer}.btn-danger{background:#dc2626;color:#fff}.btn-danger:hover{background:#b91c1c}.btn-secondary{background:#fff;color:#334155;border:1px solid #dbe2ea}
		@media(max-width:760px){.app-shell{grid-template-columns:1fr;width:100%;height:100vh;margin:0;border:0;border-radius:0}.sidebar{max-height:220px;border-left:0;border-bottom:1px solid var(--border)}.brand{padding:10px 14px}.brand p{display:none}.new-chat{margin:8px 12px}.conversation-list{display:flex;overflow-x:auto;overflow-y:hidden;padding:0 9px 8px}.conversation-item{min-width:210px;margin-left:6px}.sidebar-title{display:none}.chat-header{height:58px;padding:0 14px}.chat-messages{padding:16px}.message{max-width:88%}.toast-stack{left:12px;right:12px;top:12px}.app-toast{min-width:0;max-width:none}}
	</style>
</head>
<body>
	<main class="app-shell">
		<aside class="sidebar">
			<div class="brand"><img class="logo" src="logo.png" alt="Autorply" /><div><h1>مساعد Autorply</h1><p>محادثات محفوظة وآمنة</p></div></div>
			<button id="new-chat-button" class="new-chat">＋ محادثة جديدة</button>
			<div id="limit-notice" class="notice"></div>
			<div class="sidebar-title"><span>المحادثات</span><span id="conversation-count">0 / 20</span></div>
			<div id="conversation-list" class="conversation-list"></div>
		</aside>
		<section class="chat-area">
			<header class="chat-header">
				<h2 id="conversation-title">محادثة جديدة</h2>
				<span id="connection-status" class="status"><span class="status-dot"></span><span id="connection-status-text">جاري الاتصال</span></span>
			</header>
			<div id="chat-messages" class="chat-messages"></div>
			<div class="typing-indicator" id="typing-indicator">جاري تجهيز الرد...</div>
			<div class="message-input"><textarea id="user-input" placeholder="اكتب طلبك هنا..." rows="1" disabled></textarea><button id="send-button" disabled>إرسال</button></div>
		</section>
	</main>

	<div id="toast-stack" class="toast-stack" aria-live="polite"></div>

	<div id="delete-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title" hidden>
		<div class="confirm-card">
			<div class="confirm-body"><div class="confirm-icon">!</div><h3 id="delete-modal-title">حذف المحادثة؟</h3><p>سيتم حذف المحادثة ورسائلها نهائيًا، ولا يمكن التراجع عن هذا الإجراء.</p></div>
			<div class="confirm-actions"><button id="confirm-delete-button" class="btn btn-danger">حذف</button><button id="cancel-delete-button" class="btn btn-secondary">إلغاء</button></div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
	<script src="chat.js"></script>
</body>
</html>

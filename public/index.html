<!doctype html>
<html lang="ar" dir="rtl">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<base href="/autorply-ai/" />

		<title>مساعد Autorply</title>

		<style>
			:root {
				--primary: #176bff;
				--primary-hover: #0d5bea;
				--background: #f7f9fc;
				--surface: #ffffff;
				--border: #e6eaf0;
				--text: #172033;
				--muted: #778198;
				--user-message: #176bff;
				--assistant-message: #f0f3f8;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				min-height: 100vh;
				background: var(--background);
				color: var(--text);
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial,
					sans-serif;
			}

			.app {
				width: min(920px, calc(100% - 28px));
				margin: 0 auto;
				padding: 24px 0;
			}

			header {
				display: flex;
				align-items: center;
				gap: 14px;
				margin-bottom: 20px;
			}

			.logo {
				width: 54px;
				height: 54px;
				object-fit: contain;
				border-radius: 14px;
				background: white;
				padding: 5px;
				box-shadow: 0 8px 24px rgba(23, 107, 255, 0.1);
			}

			.header-text h1 {
				font-size: 1.35rem;
				margin-bottom: 3px;
			}

			.header-text p {
				color: var(--muted);
				font-size: 0.9rem;
			}

			.status {
				display: inline-flex;
				align-items: center;
				gap: 6px;
			}

			.status::before {
				content: "";
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: #18b875;
			}

			.chat-container {
				display: flex;
				flex-direction: column;
				height: calc(100vh - 135px);
				min-height: 520px;
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 18px;
				overflow: hidden;
				box-shadow: 0 14px 40px rgba(30, 46, 80, 0.06);
			}

			.chat-messages {
				flex: 1;
				overflow-y: auto;
				padding: 24px;
				background:
					radial-gradient(
						circle at top right,
						rgba(23, 107, 255, 0.05),
						transparent 32%
					),
					var(--surface);
			}

			.message {
				width: fit-content;
				max-width: min(78%, 650px);
				margin-bottom: 14px;
				padding: 12px 15px;
				border-radius: 14px;
				line-height: 1.75;
			}

			.message p {
				white-space: pre-line;
				overflow-wrap: anywhere;
			}

			.user-message {
				margin-right: auto;
				background: var(--user-message);
				color: white;
				border-bottom-left-radius: 4px;
			}

			.assistant-message {
				margin-left: auto;
				background: var(--assistant-message);
				border-bottom-right-radius: 4px;
			}

			.typing-indicator {
				display: none;
				padding: 0 24px 14px;
				color: var(--muted);
				font-size: 0.9rem;
			}

			.typing-indicator.visible {
				display: block;
			}

			.message-input {
				display: flex;
				align-items: flex-end;
				gap: 10px;
				padding: 14px;
				border-top: 1px solid var(--border);
				background: white;
			}

			#user-input {
				flex: 1;
				min-height: 48px;
				max-height: 150px;
				padding: 13px 15px;
				border: 1px solid var(--border);
				border-radius: 12px;
				outline: none;
				resize: none;
				font: inherit;
				direction: rtl;
				transition: border-color 0.2s;
			}

			#user-input:focus {
				border-color: var(--primary);
			}

			#send-button {
				height: 48px;
				padding: 0 22px;
				border: 0;
				border-radius: 12px;
				background: var(--primary);
				color: white;
				font: inherit;
				font-weight: 600;
				cursor: pointer;
				transition:
					background 0.2s,
					transform 0.2s;
			}

			#send-button:hover {
				background: var(--primary-hover);
			}

			#send-button:active {
				transform: scale(0.97);
			}

			#send-button:disabled {
				opacity: 0.55;
				cursor: not-allowed;
			}

			@media (max-width: 640px) {
				.app {
					width: 100%;
					padding: 0;
				}

				header {
					padding: 14px;
					margin: 0;
				}

				.chat-container {
					height: calc(100vh - 82px);
					min-height: 0;
					border-radius: 0;
					border-left: 0;
					border-right: 0;
				}

				.message {
					max-width: 88%;
				}
			}
		</style>
	</head>

	<body>
		<main class="app">
			<header>
				<img
					class="logo"
					src="logo.png"
					alt="Autorply"
				/>

				<div class="header-text">
					<h1>مساعد Autorply</h1>
					<p class="status">متصل وجاهز لمساعدتك</p>
				</div>
			</header>

			<section class="chat-container">
				<div id="chat-messages" class="chat-messages">
					<div class="message assistant-message">
						<p>مرحبًا 👋

أنا مساعد Autorply. كيف أقدر أخدمك اليوم؟</p>
					</div>
				</div>

				<div class="typing-indicator" id="typing-indicator">
					جاري تجهيز الرد...
				</div>

				<div class="message-input">
					<textarea
						id="user-input"
						placeholder="اكتب طلبك هنا..."
						rows="1"
						autofocus
					></textarea>

					<button id="send-button">إرسال</button>
				</div>
			</section>
		</main>

		<script src="chat.js"></script>
	</body>
</html>
